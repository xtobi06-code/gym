<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090a">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f5">
<meta name="color-scheme" content="dark light">
<script>try { var t = JSON.parse(localStorage.getItem("gym-thema")); if (t === "hell" || t === "dunkel") document.documentElement.dataset.thema = t; } catch (e) {}</script>
<title>Gym</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/gym-180.png?v=3">
<link rel="icon" href="icons/gym-512.png?v=3">
<!--CSS--><link rel="stylesheet" href="gym.css"><!--/CSS-->
</head>
<body>
<main id="ansicht"><div id="inhalt"></div></main>

<div class="tabfade" aria-hidden="true"></div>
<nav class="tabbar glas" id="tabs" aria-label="Bereiche">
  <span class="tab-pille" aria-hidden="true"></span>
  <button data-akt="tab" data-tab="training"><svg class="ic" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 7v10M3.5 9.5v5M17.5 7v10M20.5 9.5v5M6.5 12h11"/></svg><span>Training</span></button>
  <button data-akt="tab" data-tab="studio"><svg class="ic" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V3.5h14V21M3.5 21h17M5 7h14M12 7v4M9 11h6v3H9zM9 15.5h6v3H9z"/></svg><span>Studio</span></button>
  <button data-akt="tab" data-tab="fortschritt"><svg class="ic" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5v14h16M8 15l3.5-4.5 3 2.5L19 7"/></svg><span>Fortschritt</span></button>
</nav>
<!-- Gewählten Reiter sofort markieren, damit die Leiste beim Start nicht nachträglich umspringt -->
<script>try { var b = document.querySelector('#tabs [data-tab="' + (JSON.parse(localStorage.getItem('gym-tab')) || 'training') + '"]'); if (b) { b.classList.add('an'); document.getElementById('tabs').style.setProperty('--i', [].indexOf.call(document.querySelectorAll('#tabs button'), b)); } } catch (e) { /* egal */ }</script>

<section id="live" hidden aria-label="Laufendes Training"></section>
<div id="blaetter"></div>
<div id="toast" role="status"></div>

<!--JS-->
<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/bibliothek.js"></script>
<script src="js/sync.js"></script>
<script src="js/blatt.js"></script>
<script src="js/satz.js"></script>
<script src="js/live.js"></script>
<script src="js/plan.js"></script>
<script src="js/studio.js"></script>
<script src="js/info.js"></script>
<script src="js/fortschritt.js"></script>
<script src="js/mehr.js"></script>
<script src="js/vorlage.js"></script>
<script src="js/sortier.js"></script>
<script src="js/wisch.js"></script>
<script src="js/main.js"></script>
<!--/JS-->
</body>
</html>
