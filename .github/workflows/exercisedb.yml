name: Uebungsdaten holen
on:
  push:
    paths: ['.github/workflows/exercisedb.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  holen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ExerciseDB V1 laden
        run: |
          mkdir -p werkzeug
          python3 - <<'PY'
          import json, urllib.request, time
          alle, quelle = [], None
          for basis in ['https://oss.exercisedb.dev', 'https://exercisedb-api.vercel.app']:
              try:
                  alle, off = [], 0
                  while True:
                      url = f'{basis}/api/v1/exercises?offset={off}&limit=100'
                      with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent': 'gym-app'}), timeout=30) as r:
                          j = json.load(r)
                      daten = j.get('data', j) if isinstance(j, dict) else j
                      if not daten: break
                      alle += daten; off += len(daten)
                      print(basis, off, flush=True)
                      if off > 3000: break
                      time.sleep(0.6)
                  if alle: quelle = basis; break
              except Exception as e:
                  print('Fehler', basis, e)
          json.dump({'quelle': quelle, 'uebungen': alle}, open('werkzeug/exercisedb.json', 'w'), ensure_ascii=False)
          print('gesamt', len(alle))
          PY
      - name: Speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add werkzeug/exercisedb.json
          git commit -m "Übungsdaten aktualisiert" || exit 0
          git push
