name: Uebungsdaten holen
on:
  push:
    paths: ['.github/workflows/exercisedb.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  holen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: ExerciseDB V1 laden
        run: |
          mkdir -p werkzeug
          python3 - <<'PY'
          import json, urllib.request, time
          basis = 'https://oss.exercisedb.dev'
          alle, off, fehler = [], 0, 0
          while off < 3000 and fehler < 8:
              url = f'{basis}/api/v1/exercises?offset={off}&limit=25'
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent': 'gym-app'}), timeout=30) as r:
                      j = json.load(r)
              except Exception as e:
                  fehler += 1; print('Fehler', off, e, flush=True); time.sleep(15 * fehler); continue
              daten = j.get('data', []) if isinstance(j, dict) else j
              if not daten: break
              alle += daten; off += len(daten); fehler = 0
              print(off, flush=True)
              time.sleep(2)
          json.dump({'quelle': basis, 'uebungen': alle}, open('werkzeug/exercisedb.json', 'w'), ensure_ascii=False)
          print('gesamt', len(alle))
          PY
      - name: Speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add werkzeug/exercisedb.json
          git commit -m "Übungsdaten aktualisiert" || exit 0
          git push
