name: Uebungsdaten holen
on:
  push:
    paths: ['.github/workflows/exercisedb.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  holen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: ExerciseDB V1 laden
        run: |
          mkdir -p werkzeug
          python3 - <<'PY'
          import json, urllib.request, time
          basis = 'https://oss.exercisedb.dev'
          url = f'{basis}/api/v1/exercises?limit=25'
          alle, gesehen, fehler, seiten = [], set(), 0, 0
          while url and fehler < 8 and seiten < 200:
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent': 'gym-app'}), timeout=30) as r:
                      j = json.load(r)
              except Exception as e:
                  fehler += 1; print('Fehler', url, e, flush=True); time.sleep(15 * fehler); continue
              seiten += 1; fehler = 0
              if seiten == 1: print('Schluessel', list(j.keys()) if isinstance(j, dict) else 'liste', json.dumps(j.get('metadata') if isinstance(j, dict) else None)[:500], flush=True)
              daten = j.get('data', []) if isinstance(j, dict) else j
              neu = [x for x in daten if x.get('exerciseId') not in gesehen]
              for x in neu: gesehen.add(x.get('exerciseId'))
              alle += neu
              m = j.get('metadata') or j.get('meta') or {} if isinstance(j, dict) else {}
              nxt = m.get('nextPage') or m.get('next') or m.get('nextUrl')
              cur = m.get('nextCursor') or m.get('cursor')
              if nxt: url = nxt if nxt.startswith('http') else basis + nxt
              elif cur: url = f'{basis}/api/v1/exercises?limit=25&after={cur}'
              else: url = None
              if not neu: url = None
              print(len(alle), url, flush=True)
              time.sleep(1.5)
          json.dump({'quelle': basis, 'uebungen': alle}, open('werkzeug/exercisedb.json', 'w'), ensure_ascii=False)
          print('gesamt', len(alle))
          PY
      - name: Speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add werkzeug/exercisedb.json
          git commit -m "Übungsdaten aktualisiert" || exit 0
          git push
